[package]
name = "api_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Nuevas dependencias para gRPC en Rust
tonic = "0.10"
prost = "0.12"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
# Dapr (HTTP client)
reqwest = { version = "0.11", features = ["json"] }

[build-dependencies]
# Esta dependencia compila el .proto antes de correr el código principal
tonic-build = "0.10"